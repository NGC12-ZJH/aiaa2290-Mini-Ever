[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ever"
version = "0.1.0"
description = "Testing the T -> D -> M chain of credible deletion in a small face-recognition system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=9.5",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
mini-ever = "mini_ever.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
